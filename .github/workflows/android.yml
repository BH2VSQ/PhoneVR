name: Android CI

on:
  push:
    paths:
      - "android/**"
      - "docs/network-protocol-v1.md"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/network-protocol-v1.md"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/*.gradle.kts
            android/gradle.properties
            android/app/*.gradle.kts

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test and build Android APKs
        run: bash ./scripts/build-android.sh both

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PhoneVRStream-Android-${{ github.sha }}
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 30
